<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unreal Tactical — Western Outpost 1998</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #05070a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      touch-action: none;
    }
    #top-nav {
      height: 48px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hud-btn:active { transform: scale(0.95); background: #38bdf8; color: #000; }
    .hud-btn.active-p { background: #0284c7; border-color: #38bdf8; }
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100vw;
      overflow: hidden;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #touch-guide {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(10, 15, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
      backdrop-filter: blur(6px);
      z-index: 40;
    }
  </style>
</head>
<body>

<header id="top-nav">
  <div class="hud-title">
    <span>⚡ UNREAL TACTICAL ENGINE</span>
    <span style="color:#64748b;">|</span>
    <span id="player-status" style="color:#38bdf8;">SQUAD 1 (BLUE TEAM)</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="hud-btn active-p" id="switchBtn" onclick="switchPlayer()">🕹️ SWITCH TO P2</button>
    <button class="hud-btn" onclick="spawnOperator()">🎖️ DEPLOY OPERATOR</button>
  </div>
</header>

<div id="canvas-container">
  <canvas id="gameCanvas"></canvas>
  <div id="touch-guide">
    👉 <strong>Touch Controls:</strong> တပ်သားကို ထိ၍ ရွေးချယ်ပါ / မြေပြင်ကို ထိ၍ နေရာရွှေ့ပါ / Screen ပေါ် လက်ဆွဲ၍ Box ဖြင့် အဖွဲ့လိုက် ရွေးပါ
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WORLD_W = 2400;
const WORLD_H = 1600;
let camera = { x: 0, y: 0 };

let currentPlayer = 1;
let units = [];
let zombies = [];
let bullets = [];
let particles = [];
let trees = [];

// Touch & Selection States
let selectedUnits = [];
let touchStart = { x: 0, y: 0, time: 0 };
let isDraggingBox = false;
let dragBox = { x1: 0, y1: 0, x2: 0, y2: 0 };

// Forest & Territory Definition
const townZone = { x: 0, y: 0, w: 1000, h: WORLD_H };
const forestZone = { x: 1000, y: 0, w: 1400, h: WORLD_H };

// Bases
const bases = [
  { x: 120, y: 220, w: 180, h: 130, name: "P1 Alpha Outpost", p: 1 },
  { x: 120, y: 1100, w: 180, h: 130, name: "P2 Bravo Outpost", p: 2 }
];

// Generate Realistic Trees
for (let i = 0; i < 180; i++) {
  trees.push({
    x: forestZone.x + 80 + Math.random() * (forestZone.w - 160),
    y: 80 + Math.random() * (WORLD_H - 160),
    size: 32 + Math.random() * 24,
    rotation: Math.random() * Math.PI * 2
  });
}

// -------------------------------------------------------------
// REALISTIC TOP-DOWN SOLDIER CLASS (Realistic Detailed Mesh)
// -------------------------------------------------------------
class TacticalOperator {
  constructor(x, y, player) {
    this.x = x;
    this.y = y;
    this.player = player;
    this.targetX = x;
    this.targetY = y;
    this.selected = false;
    this.hp = 100;
    this.maxHp = 100;
    this.speed = 2.4;
    this.facing = 0;
    this.walkCycle = 0;
    this.shootTimer = 0;
    this.muzzleFlash = 0;
    this.range = 180;
  }

  update() {
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 5) {
      this.facing = Math.atan2(dy, dx);
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
      this.walkCycle += 0.25;
    }

    // Guard & Fire System
    if (this.shootTimer > 0) this.shootTimer--;
    if (this.shootTimer === 0) {
      let target = null;
      let minD = this.range;

      zombies.forEach(z => {
        const d = Math.hypot(z.x - this.x, z.y - this.y);
        if (d < minD) {
          minD = d;
          target = z;
        }
      });

      if (target) {
        this.facing = Math.atan2(target.y - this.y, target.x - this.x);
        this.muzzleFlash = 3;
        this.shootTimer = 16;

        bullets.push({
          x: this.x + Math.cos(this.facing) * 22,
          y: this.y + Math.sin(this.facing) * 22,
          tx: target.x, ty: target.y,
          dmg: 22, life: 6
        });

        // Eject Shell Casing
        particles.push(new ShellParticle(this.x, this.y, this.facing));
      }
    }
  }

  draw() {
    const inForest = this.x > forestZone.x;

    // 1. Realistic Volumetric Conical Flashlight (တောထဲ ဓာတ်မီးကွင်း)
    if (inForest) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.facing);

      const beamGrad = ctx.createRadialGradient(0, 0, 12, 160, 0, 210);
      beamGrad.addColorStop(0, "rgba(255, 250, 210, 0.65)");
      beamGrad.addColorStop(0.4, "rgba(255, 240, 180, 0.25)");
      beamGrad.addColorStop(0.8, "rgba(255, 230, 140, 0.08)");
      beamGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 210, -Math.PI / 4.2, Math.PI / 4.2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.save();

    // 2. Realistic Dynamic Soft Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.beginPath();
    ctx.ellipse(this.x + 4, this.y + 6, 12, 7, this.facing, 0, Math.PI * 2);
    ctx.fill();

    // 3. Selection Halo
    if (this.selected) {
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 4. Procedural Realistic Soldier Model
    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing);

    // Boots (Animated Walking)
    const legOffset = Math.sin(this.walkCycle) * 5;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(-10 + legOffset, -8, 6, 4);
    ctx.fillRect(-10 - legOffset, 4, 6, 4);

    // Tactical Blue Vest (ပခုံးသိုင်းကြိုး နှင့် ကျောပိုးအိတ်)
    ctx.fillStyle = this.player === 1 ? "#1e3a8a" : "#0284c7";
    ctx.fillRect(-10, -9, 16, 18);

    // MOLLE Pouches & Vest Texture
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(-12, -7, 4, 14); // Backpack
    ctx.fillStyle = "#3b82f6";
    ctx.fillRect(-6, -7, 8, 4);
    ctx.fillRect(-6, 3, 8, 4);

    // Shoulders
    ctx.fillStyle = "#1e40af";
    ctx.beginPath();
    ctx.arc(-2, -9, 4, 0, Math.PI * 2);
    ctx.arc(-2, 9, 4, 0, Math.PI * 2);
    ctx.fill();

    // Arms Holding Assault Rifle
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, -7, 10, 4);
    ctx.fillRect(2, 4, 8, 3);

    // M4 Assault Rifle
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(4, 1, 18, 3.5); // Barrel
    ctx.fillStyle = "#334155";
    ctx.fillRect(8, 0, 7, 5.5); // Receiver & Magazine

    // Kevlar Helmet & Goggles
    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(-1, 0, 6.5, 0, Math.PI * 2);
    ctx.fill();
    // Night-vision Goggle / Visor
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(2, -3.5, 3.5, 7);

    // Muzzle Flash Effect (ပစ်ခတ်ချိန် မီးပွင့်ထွက်ခြင်း)
    if (this.muzzleFlash > 0) {
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(26, 3, 7 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.arc(24, 3, 4, 0, Math.PI * 2);
      ctx.fill();
      this.muzzleFlash--;
    }

    ctx.restore();

    // Health Bar
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(this.x - 12, this.y - 24, 24, 4);
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(this.x - 12, this.y - 24, 24 * (this.hp / this.maxHp), 4);
  }
}

// -------------------------------------------------------------
// REALISTIC ZOMBIE CLASS (Top-Down Claws & Decay)
// -------------------------------------------------------------
class RealisticZombie {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.hp = 80;
    this.maxHp = 80;
    this.speed = 1.3;
    this.facing = 0;
    this.biteTimer = 0;
    this.walkCycle = Math.random() * 10;
  }

  update() {
    let closest = null;
    let minD = 220;

    units.forEach(u => {
      const d = Math.hypot(u.x - this.x, u.y - this.y);
      if (d < minD) {
        minD = d;
        closest = u;
      }
    });

    if (closest) {
      const dx = closest.x - this.x;
      const dy = closest.y - this.y;
      const dist = Math.hypot(dx, dy);

      this.facing = Math.atan2(dy, dx);
      if (dist > 14) {
        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
        this.walkCycle += 0.15;
      } else {
        if (this.biteTimer === 0) {
          closest.hp -= 15;
          this.biteTimer = 22;
        }
      }
    }
    if (this.biteTimer > 0) this.biteTimer--;
  }

  draw() {
    ctx.save();
    // Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.beginPath();
    ctx.ellipse(this.x + 3, this.y + 5, 10, 6, this.facing, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing);

    // Torso (Torn Clothes)
    ctx.fillStyle = "#334155";
    ctx.fillRect(-8, -8, 14, 16);

    // Extended Claws (ရှေ့သို့ ဆန့်တန်းထားသော လက်များ)
    const armWave = Math.sin(this.walkCycle) * 3;
    ctx.fillStyle = "#475569";
    ctx.fillRect(4, -8 + armWave, 12, 3.5);
    ctx.fillRect(4, 5 - armWave, 12, 3.5);

    // Head with Blood Stains
    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();

    // Red Eyes
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(3, -3, 2, 2);
    ctx.fillRect(3, 1, 2, 2);

    ctx.restore();
  }
}

// Shell Casing Particle
class ShellParticle {
  constructor(x, y, angle) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle - Math.PI / 2) * (1.5 + Math.random());
    this.vy = Math.sin(angle - Math.PI / 2) * (1.5 + Math.random());
    this.life = 20;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }
  draw() {
    ctx.fillStyle = "#fbbf24";
    ctx.fillRect(this.x, this.y, 2, 1.5);
  }
}

// 3:2 Ratio Logic
function balanceThreats() {
  const targetZombies = Math.max(4, Math.ceil(units.length * 1.5));
  if (zombies.length < targetZombies) {
    const sx = forestZone.x + 100 + Math.random() * (forestZone.w - 200);
    const sy = 100 + Math.random() * (WORLD_H - 200);
    zombies.push(new RealisticZombie(sx, sy));
  }
}

function spawnOperator() {
  const base = activePlayer === 1 ? bases[0] : bases[1];
  const u = new TacticalOperator(base.x + base.w + 20, base.y + 40 + Math.random() * 40, activePlayer);
  u.targetX = u.x + 80;
  u.targetY = u.y;
  units.push(u);
}

let activePlayer = 1;
function switchPlayer() {
  activePlayer = activePlayer === 1 ? 2 : 1;
  document.getElementById("player-status").innerText = `SQUAD ${activePlayer} (BLUE TEAM)`;
  document.getElementById("switchBtn").innerText = `🕹️ SWITCH TO P${activePlayer === 1 ? 2 : 1}`;
  selectedUnits = [];
  units.forEach(u => u.selected = false);
}

// -------------------------------------------------------------
// TOUCH & SCREEN INTERACTION ENGINE (ထိတွေ့ ရွှေ့လျားမှု စနစ်)
// -------------------------------------------------------------
function handlePointerDown(screenX, screenY) {
  touchStart = { x: screenX, y: screenY, time: Date.now() };
  isDraggingBox = true;
  dragBox = { x1: screenX + camera.x, y1: screenY + camera.y, x2: screenX + camera.x, y2: screenY + camera.y };
}

function handlePointerMove(screenX, screenY) {
  if (isDraggingBox) {
    dragBox.x2 = screenX + camera.x;
    dragBox.y2 = screenY + camera.y;
  }
}

function handlePointerUp(screenX, screenY) {
  if (!isDraggingBox) return;
  isDraggingBox = false;

  const duration = Date.now() - touchStart.time;
  const distMoved = Math.hypot(screenX - touchStart.x, screenY - touchStart.y);
  const worldX = screenX + camera.x;
  const worldY = screenY + camera.y;

  // Single Tap on screen (မဆွဲဘဲ ခလုတ်နှိပ်သလို ထိလိုက်ခြင်း)
  if (distMoved < 10 && duration < 300) {
    // 1. တပ်သားကို ထိမိခြင်း ရှိမရှိ စစ်ဆေးခြင်း
    let tappedUnit = null;
    units.forEach(u => {
      if (u.player === activePlayer && Math.hypot(u.x - worldX, u.y - worldY) < 28) {
        tappedUnit = u;
      }
    });

    if (tappedUnit) {
      // တပ်သားကို ရွေးချယ်လိုက်ခြင်း
      selectedUnits = [tappedUnit];
      units.forEach(u => u.selected = (u === tappedUnit));
    } else {
      // မြေပြင်ကို ထိလိုက်ပါက ရွေးထားသော တပ်သားများကို နေရာရွှေ့စေခြင်း
      if (selectedUnits.length > 0) {
        selectedUnits.forEach((u, idx) => {
          u.targetX = worldX + (idx % 3) * 26 - 26;
          u.targetY = worldY + Math.floor(idx / 3) * 26 - 26;
        });
      }
    }
  } else {
    // Drag Selection Box (လက်ချောင်းဖြင့် ဆွဲ၍ အုပ်စုလိုက် ရွေးချယ်ခြင်း)
    selectedUnits = [];
    const minX = Math.min(dragBox.x1, dragBox.x2);
    const maxX = Math.max(dragBox.x1, dragBox.x2);
    const minY = Math.min(dragBox.y1, dragBox.y2);
    const maxY = Math.max(dragBox.y1, dragBox.y2);

    units.forEach(u => {
      if (u.player === activePlayer) {
        if (u.x >= minX && u.x <= maxX && u.y >= minY && u.y <= maxY) {
          u.selected = true;
          selectedUnits.push(u);
        } else {
          u.selected = false;
        }
      }
    });
  }
}

// Touch Event Listeners (ဖုန်းအတွက်)
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  handlePointerDown(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  handlePointerMove(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touch = e.changedTouches[0];
  handlePointerUp(touch.clientX - rect.left, touch.clientY - rect.top);
}, { passive: false });

// Mouse Event Listeners (ကွန်ပျူတာအတွက်)
canvas.addEventListener("mousedown", (e) => {
  const rect = canvas.getBoundingClientRect();
  handlePointerDown(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  handlePointerMove(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener("mouseup", (e) => {
  const rect = canvas.getBoundingClientRect();
  handlePointerUp(e.clientX - rect.left, e.clientY - rect.top);
});

// Canvas Sizing
function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener("resize", resize);
resize();

// Initial Units
spawnOperator();
spawnOperator();

// -------------------------------------------------------------
// AAA RENDER PIPELINE LOOP
// -------------------------------------------------------------
function render() {
  balanceThreats();

  // Smooth Camera Follow Selection
  if (selectedUnits.length > 0) {
    const leader = selectedUnits[0];
    camera.x += (leader.x - canvas.width / 2 - camera.x) * 0.05;
    camera.y += (leader.y - canvas.height / 2 - camera.y) * 0.05;
    camera.x = Math.max(0, Math.min(camera.x, WORLD_W - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, WORLD_H - canvas.height));
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // 1. Photorealistic Dirt & Forest Terrain
  ctx.fillStyle = "#5c4028"; // Dusty Sand Dirt
  ctx.fillRect(townZone.x, townZone.y, townZone.w, townZone.h);

  ctx.fillStyle = "#121a14"; // Dark Dense Forest Ground
  ctx.fillRect(forestZone.x, forestZone.y, forestZone.w, forestZone.h);

  // Dirt Roads with Soft Edge Blur
  ctx.strokeStyle = "rgba(45, 30, 15, 0.4)";
  ctx.lineWidth = 40;
  ctx.beginPath();
  ctx.moveTo(150, 280);
  ctx.lineTo(800, 500);
  ctx.lineTo(1400, 800);
  ctx.stroke();

  // 2. Realistic Bases
  bases.forEach(b => {
    // Ambient Occlusion Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(b.x + 12, b.y + 12, b.w, b.h);

    ctx.fillStyle = "#1e293b";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = b.p === 1 ? "#1e3a8a" : "#0284c7";
    ctx.fillRect(b.x + 6, b.y + 6, b.w - 12, 14);

    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 13px -apple-system, sans-serif";
    ctx.fillText(b.name, b.x + 14, b.y + 40);
  });

  // 3. Realistic Scenery Trees (Layered Depth)
  trees.forEach(t => {
    // Directional Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.beginPath();
    ctx.ellipse(t.x + 16, t.y + 16, t.size * 1.1, t.size * 0.7, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Base Canopy
    ctx.fillStyle = "#0a1f0d";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
    ctx.fill();

    // Mid Leaves
    ctx.fillStyle = "#143818";
    ctx.beginPath();
    ctx.arc(t.x - 3, t.y - 3, t.size * 0.78, 0, Math.PI * 2);
    ctx.fill();

    // Highlight Canopy
    ctx.fillStyle = "#1f5225";
    ctx.beginPath();
    ctx.arc(t.x - 6, t.y - 6, t.size * 0.45, 0, Math.PI * 2);
    ctx.fill();
  });

  // 4. Update & Draw Units
  for (let i = units.length - 1; i >= 0; i--) {
    units[i].update();
    units[i].draw();
    if (units[i].hp <= 0) units.splice(i, 1);
  }

  // 5. Update & Draw Zombies
  for (let i = zombies.length - 1; i >= 0; i--) {
    zombies[i].update();
    zombies[i].draw();
    if (zombies[i].hp <= 0) zombies.splice(i, 1);
  }

  // 6. Bullets Tracers
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.tx, b.ty);
    ctx.stroke();

    b.life--;
    if (b.life === 1) {
      zombies.forEach(z => {
        if (Math.hypot(z.x - b.tx, z.y - b.ty) < 22) z.hp -= b.dmg;
      });
    }
    if (b.life <= 0) bullets.splice(i, 1);
  }

  // 7. Shell Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // 8. Drag-to-Select Box
  if (isDraggingBox) {
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1.5;
    ctx.fillStyle = "rgba(56, 189, 248, 0.12)";
    const bx = Math.min(dragBox.x1, dragBox.x2);
    const by = Math.min(dragBox.y1, dragBox.y2);
    const bw = Math.abs(dragBox.x1 - dragBox.x2);
    const bh = Math.abs(dragBox.y1 - dragBox.y2);
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);
  }

  ctx.restore();
  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>

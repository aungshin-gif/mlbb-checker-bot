<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Western Outpost 1998 — RTS Strategy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #111;
      color: #eee;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    #ui-bar {
      width: 100vw;
      max-width: 900px;
      background: #2b1f14;
      border-bottom: 2px solid #5a4128;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13px;
    }
    .btn {
      background: #4a3525;
      border: 1px solid #8c6743;
      color: #f5deb3;
      padding: 5px 10px;
      font-family: inherit;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:active { background: #8c6743; color: #fff; }
    .btn-switch { background: #8b0000; border-color: #ff4500; color: white; }
    #canvas-container {
      position: relative;
      border: 2px solid #5a4128;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas { display: block; background: #8f6c42; cursor: crosshair; }
    #instructions {
      font-size: 11px;
      color: #aaa;
      padding: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="ui-bar">
  <div>
    <strong>TIME:</strong> <span id="time-display">DAY (12:00)</span> | 
    <strong>GOLD:</strong> <span id="gold-display" style="color: #ffd700;">300</span>
  </div>
  <div>
    <button class="btn btn-switch" onclick="switchPlayer()">🕹️ SWITCH TO <span id="player-label">P2</span></button>
    <button class="btn" onclick="spawnUnit('soldier')">🎖️ Recruit Soldier (50G)</button>
    <button class="btn" onclick="spawnUnit('wagon')">🚜 Build Wagon (120G)</button>
  </div>
</div>

<div id="canvas-container">
  <canvas id="gameCanvas" width="900" height="520"></canvas>
</div>

<div id="instructions">
  [ထိန်းချုပ်နည်း] စစ်သား/ယာဉ်ကို Click သို့မဟုတ် Drag ဆွဲပြီး ရွေးပါ -> သွားလိုရာ မြေနေရာကို Right Click (သို့မဟုတ် Screen ကို ပုတ်ပြီး အမိန့်ပေးပါ)။ တောထဲက Vampire များကို အဖွဲ့လိုက် ပစ်ခတ်တိုက်ခိုက်ပါ။
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game State
let currentPlayer = 1; // 1 or 2
let gold = { 1: 250, 2: 250 };
let dayTime = 0; // 0 to 1200 (Day: 0-600, Night: 600-1200)
let selectedUnits = [];
let isSelecting = false;
let selectBox = { x1: 0, y1: 0, x2: 0, y2: 0 };

// Entities
let units = [];
let vampires = [];
let bullets = [];
let trees = [];

// Map Structures
const baseP1 = { x: 80, y: 100, w: 90, h: 70, name: "P1 Barracks", owner: 1 };
const factoryP1 = { x: 80, y: 200, w: 80, h: 60, name: "P1 Wagon Works", owner: 1 };

const baseP2 = { x: 80, y: 350, w: 90, h: 70, name: "P2 Barracks", owner: 2 };
const factoryP2 = { x: 80, y: 440, w: 80, h: 60, name: "P2 Wagon Works", owner: 2 };

const graveyard = { x: 740, y: 200, w: 120, h: 120, name: "Cursed Hill Graveyard" };

// Generate Woods/Forest (တောအုပ်)
for (let i = 0; i < 45; i++) {
  trees.push({
    x: 350 + Math.random() * 260,
    y: 40 + Math.random() * 440,
    r: 14 + Math.random() * 10
  });
}

// Unit Blueprint
class Unit {
  constructor(x, y, type, player) {
    this.x = x;
    this.y = y;
    this.type = type; // 'soldier' or 'wagon'
    this.player = player;
    this.selected = false;
    this.targetX = x;
    this.targetY = y;
    this.hp = type === 'wagon' ? 220 : 60;
    this.maxHp = this.hp;
    this.speed = type === 'wagon' ? 1.2 : 1.6;
    this.range = type === 'wagon' ? 140 : 90;
    this.cooldown = 0;
  }

  update() {
    // Movement
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 3) {
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
    }

    // Auto Attack Nearest Vampire
    if (this.cooldown > 0) this.cooldown--;
    if (this.cooldown === 0) {
      let nearestVamp = null;
      let minDist = this.range;
      vampires.forEach(v => {
        const d = Math.hypot(v.x - this.x, v.y - this.y);
        if (d < minDist) {
          minDist = d;
          nearestVamp = v;
        }
      });

      if (nearestVamp) {
        bullets.push({
          x: this.x, y: this.y,
          tx: nearestVamp.x, ty: nearestVamp.y,
          dmg: this.type === 'wagon' ? 24 : 12,
          life: 15
        });
        this.cooldown = this.type === 'wagon' ? 35 : 20;
      }
    }
  }

  draw() {
    ctx.save();
    // Selection Ring
    if (this.selected) {
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.type === 'wagon' ? 18 : 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Body
    if (this.type === 'soldier') {
      ctx.fillStyle = this.player === 1 ? "#3498db" : "#e67e22"; // P1 Blue, P2 Orange
      ctx.fillRect(this.x - 4, this.y - 7, 8, 14);
      // Western Hat
      ctx.fillStyle = "#3e2723";
      ctx.fillRect(this.x - 6, this.y - 10, 12, 3);
    } else {
      // Armored Wagon (ယာဉ်)
      ctx.fillStyle = "#5c4033";
      ctx.fillRect(this.x - 14, this.y - 10, 28, 20);
      ctx.fillStyle = this.player === 1 ? "#2980b9" : "#d35400";
      ctx.fillRect(this.x - 6, this.y - 6, 12, 12);
      // Wheels
      ctx.fillStyle = "#111";
      ctx.fillRect(this.x - 12, this.y - 12, 6, 4);
      ctx.fillRect(this.x + 6, this.y - 12, 6, 4);
      ctx.fillRect(this.x - 12, this.y + 8, 6, 4);
      ctx.fillRect(this.x + 6, this.y + 8, 6, 4);
    }

    // Health Bar
    ctx.fillStyle = "red";
    ctx.fillRect(this.x - 8, this.y - 15, 16, 2);
    ctx.fillStyle = "lime";
    ctx.fillRect(this.x - 8, this.y - 15, 16 * (this.hp / this.maxHp), 2);
    ctx.restore();
  }
}

// Vampire Blueprint (Enemies)
class Vampire {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.hp = 70;
    this.maxHp = 70;
    this.speed = 1.1; // Night မှာ ပိုမြန်မည်
    this.biteCooldown = 0;
  }

  update(isNight) {
    this.speed = isNight ? 1.8 : 1.0;

    // Search nearest human unit
    let nearestUnit = null;
    let minDist = 9999;
    units.forEach(u => {
      const d = Math.hypot(u.x - this.x, u.y - this.y);
      if (d < minDist) {
        minDist = d;
        nearestUnit = u;
      }
    });

    if (nearestUnit) {
      const dx = nearestUnit.x - this.x;
      const dy = nearestUnit.y - this.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 8) {
        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
      } else {
        // Bite & Damage (ကိုက်ခြင်း)
        if (this.biteCooldown === 0) {
          nearestUnit.hp -= isNight ? 18 : 8;
          this.biteCooldown = 25;
        }
      }
    }
    if (this.biteCooldown > 0) this.biteCooldown--;
  }

  draw() {
    ctx.save();
    // Shadowy Red Vampire Body
    ctx.fillStyle = "#4a0000";
    ctx.fillRect(this.x - 5, this.y - 8, 10, 16);
    // Glowing Red Eyes
    ctx.fillStyle = "#ff0000";
    ctx.fillRect(this.x - 3, this.y - 6, 2, 2);
    ctx.fillRect(this.x + 1, this.y - 6, 2, 2);

    // Vampire Cloak
    ctx.fillStyle = "#1a0000";
    ctx.fillRect(this.x - 7, this.y - 2, 2, 10);
    ctx.fillRect(this.x + 5, this.y - 2, 2, 10);
    ctx.restore();
  }
}

// Controls & Spawning
function switchPlayer() {
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  document.getElementById("player-label").innerText = currentPlayer === 1 ? "P2" : "P1";
  document.getElementById("gold-display").innerText = gold[currentPlayer];
  selectedUnits = [];
  units.forEach(u => u.selected = false);
}

function spawnUnit(type) {
  const cost = type === 'wagon' ? 120 : 50;
  if (gold[currentPlayer] < cost) return;

  gold[currentPlayer] -= cost;
  document.getElementById("gold-display").innerText = gold[currentPlayer];

  const origin = currentPlayer === 1 
    ? (type === 'wagon' ? factoryP1 : baseP1) 
    : (type === 'wagon' ? factoryP2 : baseP2);

  const u = new Unit(origin.x + origin.w + 10, origin.y + 20 + Math.random() * 20, type, currentPlayer);
  u.targetX = u.x + 40;
  u.targetY = u.y;
  units.push(u);
}

// Mouse Controls for RTS Command
canvas.addEventListener("mousedown", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (e.button === 0) { // Left click: Select
    isSelecting = true;
    selectBox.x1 = mx;
    selectBox.y1 = my;
    selectBox.x2 = mx;
    selectBox.y2 = my;
  } else if (e.button === 2) { // Right click: Move / Attack Order
    selectedUnits.forEach((u, i) => {
      u.targetX = mx + (i % 3) * 16 - 16;
      u.targetY = my + Math.floor(i / 3) * 16 - 16;
    });
  }
});

canvas.addEventListener("mousemove", (e) => {
  if (isSelecting) {
    const rect = canvas.getBoundingClientRect();
    selectBox.x2 = e.clientX - rect.left;
    selectBox.y2 = e.clientY - rect.top;
  }
});

canvas.addEventListener("mouseup", (e) => {
  if (isSelecting && e.button === 0) {
    isSelecting = false;
    selectedUnits = [];
    const minX = Math.min(selectBox.x1, selectBox.x2);
    const maxX = Math.max(selectBox.x1, selectBox.x2);
    const minY = Math.min(selectBox.y1, selectBox.y2);
    const maxY = Math.max(selectBox.y1, selectBox.y2);

    units.forEach(u => {
      if (u.player === currentPlayer) {
        // Drag box select or Click select
        if ((u.x >= minX - 8 && u.x <= maxX + 8 && u.y >= minY - 8 && u.y <= maxY + 8) ||
            Math.hypot(u.x - selectBox.x1, u.y - selectBox.y1) < 14) {
          u.selected = true;
          selectedUnits.push(u);
        } else {
          u.selected = false;
        }
      }
    });
  }
});

canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// Game Loop
function gameLoop() {
  // 1. Day / Night Cycle
  dayTime = (dayTime + 1) % 1600;
  const isNight = dayTime > 800;
  document.getElementById("time-display").innerText = isNight ? "NIGHT 🌙 (VAMPIRES ENRAGED)" : "DAY ☀️ (SAFE SUN)";
  document.getElementById("time-display").style.color = isNight ? "#ff4444" : "#ffd700";

  // Periodic Gold Income
  if (dayTime % 120 === 0) {
    gold[1] += 15;
    gold[2] += 15;
    document.getElementById("gold-display").innerText = gold[currentPlayer];
  }

  // 2. Spawn Vampires from Graveyard Hill
  if (dayTime % (isNight ? 90 : 220) === 0 && vampires.length < 25) {
    vampires.push(new Vampire(graveyard.x + 20 + Math.random() * 60, graveyard.y + 40 + Math.random() * 40));
  }

  // 3. Clear Canvas & Draw Dusty Western Terrain
  ctx.fillStyle = "#87623b"; // Dusty Sand Dirt
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Woods/Forest (တောအုပ်)
  trees.forEach(t => {
    ctx.fillStyle = "rgba(40, 20, 10, 0.3)";
    ctx.beginPath();
    ctx.arc(t.x + 3, t.y + 3, t.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#1e3f20"; // Dark retro green
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2d5a2f";
    ctx.beginPath();
    ctx.arc(t.x - 2, t.y - 2, t.r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw Western Buildings
  function drawBuilding(b, color) {
    ctx.fillStyle = "#3e2723"; // Wood outline
    ctx.fillRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
    ctx.fillStyle = color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#f5deb3";
    ctx.font = "10px monospace";
    ctx.fillText(b.name, b.x + 5, b.y + 16);
  }
  drawBuilding(baseP1, "#4a6984");
  drawBuilding(factoryP1, "#34495e");
  drawBuilding(baseP2, "#b9770e");
  drawBuilding(factoryP2, "#7e5109");

  // Draw Graveyard Hill
  ctx.fillStyle = "#2b2b2b";
  ctx.fillRect(graveyard.x, graveyard.y, graveyard.w, graveyard.h);
  ctx.fillStyle = "#c0392b";
  ctx.fillText("☠️ HILL GRAVEYARD", graveyard.x + 8, graveyard.y + 20);
  // Tombstones
  ctx.fillStyle = "#7f8c8d";
  ctx.fillRect(graveyard.x + 20, graveyard.y + 40, 8, 12);
  ctx.fillRect(graveyard.x + 60, graveyard.y + 70, 8, 12);
  ctx.fillRect(graveyard.x + 90, graveyard.y + 35, 8, 12);

  // 4. Update & Draw Units
  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    u.update();
    u.draw();
    if (u.hp <= 0) units.splice(i, 1);
  }

  // 5. Update & Draw Vampires
  for (let i = vampires.length - 1; i >= 0; i--) {
    const v = vampires[i];
    v.update(isNight);
    v.draw();
    if (v.hp <= 0) vampires.splice(i, 1);
  }

  // 6. Draw Bullets & Explosions
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    ctx.strokeStyle = "#ffeb3b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.tx, b.ty);
    ctx.stroke();

    b.life--;
    if (b.life === 1) {
      // Deal damage
      vampires.forEach(v => {
        if (Math.hypot(v.x - b.tx, v.y - b.ty) < 16) v.hp -= b.dmg;
      });
    }
    if (b.life <= 0) bullets.splice(i, 1);
  }

  // 7. Drag Selection Rectangle
  if (isSelecting) {
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 1;
    ctx.strokeRect(selectBox.x1, selectBox.y1, selectBox.x2 - selectBox.x1, selectBox.y2 - selectBox.y1);
  }

  // 8. Day/Night Tint Overlay
  if (isNight) {
    ctx.fillStyle = "rgba(10, 15, 45, 0.45)"; // Dark Blue Night Filter
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  requestAnimationFrame(gameLoop);
}

// Launch Game
gameLoop();
</script>

</body>
</html>

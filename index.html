<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tactical Outpost: Survival RTS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #020408;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      touch-action: none;
    }
    #top-hud {
      height: 50px;
      background: rgba(10, 14, 23, 0.96);
      border-bottom: 2px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 100;
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-bar { display: flex; gap: 6px; }
    .hud-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .hud-btn:active { transform: scale(0.95); }
    .hud-btn.team { background: #0284c7; border-color: #38bdf8; font-weight: bold; }
    .hud-btn.active { background: #2563eb; border-color: #60a5fa; }
    #canvas-wrap {
      position: relative;
      flex: 1;
      width: 100vw;
      overflow: hidden;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #threat-hud {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      z-index: 90;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    #mobile-hint {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>
<body>

<div id="top-hud">
  <div class="hud-left">
    <span id="player-indicator" style="color: #38bdf8;">SQUAD 1 (BLUE)</span>
    <span style="color:#475569;">|</span>
    <span id="casualty-count" style="color: #ef4444;">Dead: 0</span>
  </div>
  <div class="btn-bar">
    <button class="hud-btn team" onclick="selectAllTeam()">🎖️ SELECT ALL TEAM</button>
    <button class="hud-btn active" id="btnSwitch" onclick="switchPlayer()">🕹️ SWITCH SQUAD</button>
    <button class="hud-btn" onclick="spawnOperator()">+ RECRUIT</button>
  </div>
</div>

<div id="threat-hud">⚠️ DEFCON 1: HORDE INVASION ACTIVE</div>

<div id="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="mobile-hint">
    👉 <strong>မြေပုံရွှေ့ရန်:</strong> Screen ပေါ် လက်ဖြင့် ဖိဆွဲပါ (Drag Map) | <strong>တပ်ရွှေ့ရန်:</strong> "SELECT ALL TEAM" နှိပ်ပြီး သွားလိုရာမြေပြင်ကို ထိပါ
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Sound Synthesizer Engine (Web Audio API)
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playGunfire() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);

  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.08);
}

function playZombieBite() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'triangle';
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.linearRampToValueAtTime(60, now + 0.2);

  gain.gain.setValueAtTime(0.4, now);
  gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.2);
}

function playRadioBeep() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, now);
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

// World Bounds
const WORLD_W = 4000;
const WORLD_H = 2600;
let camera = { x: 100, y: 250 };

let currentPlayer = 1;
let units = [];
let zombies = [];
let bullets = [];
let bloodSplats = [];
let scenery = [];
let casualties = 0;

// Zones
const townZone = { x: 0, y: 0, w: 1600, h: WORLD_H };
const forestZone = { x: 1600, y: 0, w: 2400, h: WORLD_H };
const hiveHill = { x: 3300, y: 1000, w: 600, h: 700 };

const bases = [
  { x: 150, y: 300, w: 200, h: 140, name: "Alpha Garrison (P1)", p: 1 },
  { x: 150, y: 1900, w: 200, h: 140, name: "Bravo Garrison (P2)", p: 2 }
];

// Generate Trees
for (let i = 0; i < 350; i++) {
  scenery.push({
    x: forestZone.x + 80 + Math.random() * (forestZone.w - 160),
    y: 80 + Math.random() * (WORLD_H - 160),
    size: 36 + Math.random() * 24
  });
}

// -------------------------------------------------------------
// OPERATOR (Running Footsteps & Fire)
// -------------------------------------------------------------
class TacticalOperator {
  constructor(x, y, player) {
    this.x = x;
    this.y = y;
    this.player = player;
    this.targetX = x;
    this.targetY = y;
    this.selected = false;
    this.hp = 100;
    this.maxHp = 100;
    this.speed = 2.8;
    this.facing = 0;
    this.walkAnim = 0;
    this.isMoving = false;
    this.shootCooldown = 0;
    this.muzzleTime = 0;
    this.range = 220;
  }

  update() {
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 8) {
      this.isMoving = true;
      this.facing = Math.atan2(dy, dx);
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
      this.walkAnim += 0.35;
    } else {
      this.isMoving = false;
    }

    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.shootCooldown === 0) {
      let target = null;
      let minD = this.range;

      zombies.forEach(z => {
        const d = Math.hypot(z.x - this.x, z.y - this.y);
        if (d < minD) {
          minD = d;
          target = z;
        }
      });

      if (target) {
        this.facing = Math.atan2(target.y - this.y, target.x - this.x);
        this.muzzleTime = 2;
        this.shootCooldown = 14;
        playGunfire();

        bullets.push({
          x: this.x + Math.cos(this.facing) * 24,
          y: this.y + Math.sin(this.facing) * 24,
          tx: target.x, ty: target.y,
          dmg: 24, life: 6
        });
      }
    }
  }

  draw() {
    const inForest = this.x > forestZone.x;

    // Flashlight in forest
    if (inForest) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.facing);

      const grad = ctx.createRadialGradient(0, 0, 10, 160, 0, 230);
      grad.addColorStop(0, "rgba(255, 250, 210, 0.65)");
      grad.addColorStop(0.5, "rgba(255, 240, 180, 0.2)");
      grad.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 230, -Math.PI / 4.5, Math.PI / 4.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.save();

    // Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.beginPath();
    ctx.ellipse(this.x + 4, this.y + 6, 12, 6, this.facing, 0, Math.PI * 2);
    ctx.fill();

    // Halo indicator
    if (this.selected) {
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing);

    // Running Legs
    const legSwing = this.isMoving ? Math.sin(this.walkAnim) * 7 : 0;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(-12 + legSwing, -8, 7, 4);
    ctx.fillRect(-12 - legSwing, 4, 7, 4);

    // Blue Tactical Uniform
    ctx.fillStyle = this.player === 1 ? "#1e3a8a" : "#0284c7";
    ctx.fillRect(-10, -9, 17, 18);

    // Backpack
    ctx.fillStyle = "#020617";
    ctx.fillRect(-13, -7, 4, 14);

    // Shoulders
    ctx.fillStyle = "#1e40af";
    ctx.beginPath();
    ctx.arc(-2, -9, 4, 0, Math.PI * 2);
    ctx.arc(-2, 9, 4, 0, Math.PI * 2);
    ctx.fill();

    // Arms Holding Rifle
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, -7, 12, 4);
    ctx.fillRect(3, 4, 9, 3.5);

    // M4 Carbine
    ctx.fillStyle = "#111827";
    ctx.fillRect(5, 1, 20, 3.5);
    ctx.fillStyle = "#374151";
    ctx.fillRect(9, 0, 7, 5);

    // Helmet
    ctx.fillStyle = "#020617";
    ctx.beginPath();
    ctx.arc(-1, 0, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(2, -3.5, 3.5, 7);

    // Muzzle Flash
    if (this.muzzleTime > 0) {
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(28, 3, 9, 0, Math.PI * 2);
      ctx.fill();
      this.muzzleTime--;
    }

    ctx.restore();

    // Health Bar
    if (this.hp < this.maxHp) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(this.x - 12, this.y - 24, 24, 4);
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(this.x - 12, this.y - 24, 24 * (this.hp / this.maxHp), 4);
    }
  }
}

// -------------------------------------------------------------
// ZOMBIES (Lurching & Bite Attack)
// -------------------------------------------------------------
class BrutalZombie {
  constructor(x, y, type = 'normal') {
    this.x = x;
    this.y = y;
    this.type = type;
    this.hp = type === 'tank' ? 320 : (type === 'sprinter' ? 60 : 100);
    this.maxHp = this.hp;
    this.speed = type === 'tank' ? 1.0 : (type === 'sprinter' ? 2.8 : 1.5);
    this.damage = type === 'tank' ? 28 : (type === 'sprinter' ? 12 : 18);
    this.facing = 0;
    this.biteTimer = 0;
    this.limpCycle = Math.random() * 10;
  }

  update() {
    let closest = null;
    let minD = 380;

    units.forEach(u => {
      const d = Math.hypot(u.x - this.x, u.y - this.y);
      if (d < minD) {
        minD = d;
        closest = u;
      }
    });

    if (closest) {
      const dx = closest.x - this.x;
      const dy = closest.y - this.y;
      const dist = Math.hypot(dx, dy);

      this.facing = Math.atan2(dy, dx);
      this.limpCycle += 0.25;

      if (dist > 14) {
        const lurch = Math.sin(this.limpCycle) * 0.4;
        this.x += (dx / dist) * (this.speed + lurch);
        this.y += (dy / dist) * (this.speed + lurch);
      } else {
        if (this.biteTimer === 0) {
          closest.hp -= this.damage;
          this.biteTimer = 20;
          playZombieBite();
          bloodSplats.push(new BloodSplat(closest.x, closest.y));

          if (closest.hp <= 0) {
            casualties++;
            document.getElementById("casualty-count").innerText = `Dead: ${casualties}`;
            setTimeout(() => {
              zombies.push(new BrutalZombie(closest.x, closest.y, 'sprinter'));
            }, 800);
          }
        }
      }
    }
    if (this.biteTimer > 0) this.biteTimer--;
  }

  draw() {
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.beginPath();
    ctx.ellipse(this.x + 3, this.y + 5, this.type === 'tank' ? 16 : 10, 6, this.facing, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing);

    const scale = this.type === 'tank' ? 1.5 : 1.0;
    ctx.scale(scale, scale);

    ctx.fillStyle = this.type === 'tank' ? "#1c1917" : "#334155";
    ctx.fillRect(-8, -8, 14, 16);

    const armWiggle = Math.sin(this.limpCycle) * 4;
    ctx.fillStyle = "#475569";
    ctx.fillRect(4, -8 + armWiggle, 14, 3.5);
    ctx.fillRect(4, 5 - armWiggle, 14, 3.5);

    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(3, -3, 2, 2);
    ctx.fillRect(3, 1, 2, 2);

    ctx.restore();
  }
}

class BloodSplat {
  constructor(x, y) {
    this.x = x + (Math.random() * 16 - 8);
    this.y = y + (Math.random() * 16 - 8);
    this.size = 6 + Math.random() * 12;
  }
  draw() {
    ctx.fillStyle = "rgba(153, 27, 27, 0.65)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// -------------------------------------------------------------
// MAP DRAGGING & TOUCH NAVIGATION (Screen ထိဆွဲပြီး မြေပုံရွှေ့ခြင်း)
// -------------------------------------------------------------
let isPanningMap = false;
let startPointer = { x: 0, y: 0 };
let startCam = { x: 0, y: 0 };
let touchStartTime = 0;

function pointerDown(clientX, clientY) {
  initAudio();
  isPanningMap = true;
  startPointer.x = clientX;
  startPointer.y = clientY;
  startCam.x = camera.x;
  startCam.y = camera.y;
  touchStartTime = Date.now();
}

function pointerMove(clientX, clientY) {
  if (isPanningMap) {
    const dx = clientX - startPointer.x;
    const dy = clientY - startPointer.y;
    // Screen ပေါ် ဆွဲလိုက်သည့်အတိုင်း မြေပုံ ရွှေ့လျားခြင်း
    camera.x = startCam.x - dx;
    camera.y = startCam.y - dy;
    camera.x = Math.max(0, Math.min(camera.x, WORLD_W - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, WORLD_H - canvas.height));
  }
}

function pointerUp(clientX, clientY) {
  if (!isPanningMap) return;
  isPanningMap = false;

  const distMoved = Math.hypot(clientX - startPointer.x, clientY - startPointer.y);
  const touchDuration = Date.now() - touchStartTime;

  // အကယ်၍ မဆွဲဘဲ မြေပြင်ကို တစ်ချက်ထိရုံသာ ထိလိုက်ပါက (Tap Command)
  if (distMoved < 12 && touchDuration < 300) {
    const worldX = clientX + camera.x;
    const worldY = clientY + camera.y;

    const selected = units.filter(u => u.selected && u.player === currentPlayer);
    if (selected.length > 0) {
      playRadioBeep();
      selected.forEach((u, i) => {
        u.targetX = worldX + (i % 4) * 32 - 48;
        u.targetY = worldY + Math.floor(i / 4) * 32 - 48;
      });
    }
  }
}

// Touch Handlers
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const t = e.touches[0];
  pointerDown(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const t = e.touches[0];
  pointerMove(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  pointerUp(t.clientX, t.clientY);
}, { passive: false });

// Mouse Handlers
canvas.addEventListener("mousedown", (e) => pointerDown(e.clientX, e.clientY));
canvas.addEventListener("mousemove", (e) => pointerMove(e.clientX, e.clientY));
canvas.addEventListener("mouseup", (e) => pointerUp(e.clientX, e.clientY));

// -------------------------------------------------------------
// TEAM COMMANDS & BUTTONS
// -------------------------------------------------------------
function selectAllTeam() {
  initAudio();
  playRadioBeep();
  units.forEach(u => {
    u.selected = (u.player === currentPlayer);
  });
}

function switchPlayer() {
  initAudio();
  playRadioBeep();
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  document.getElementById("player-indicator").innerText = `SQUAD ${currentPlayer} (BLUE)`;
  document.getElementById("btnSwitch").innerText = `🕹️ SWITCH TO P${currentPlayer === 1 ? 2 : 1}`;
  selectAllTeam();
}

function spawnOperator() {
  initAudio();
  playRadioBeep();
  const base = currentPlayer === 1 ? bases[0] : bases[1];
  const u = new TacticalOperator(base.x + base.w + 20, base.y + 30 + Math.random() * 50, currentPlayer);
  u.targetX = u.x + 80;
  u.targetY = u.y;
  u.selected = true;
  units.push(u);
}

function maintainHorde() {
  const currentUnits = units.length || 1;
  const targetZombies = Math.max(14, Math.ceil(currentUnits * 2.2));

  if (zombies.length < targetZombies) {
    const isForest = Math.random() < 0.75;
    let sx, sy;
    if (isForest) {
      sx = forestZone.x + 100 + Math.random() * (forestZone.w - 300);
      sy = 100 + Math.random() * (WORLD_H - 200);
    } else {
      sx = 500 + Math.random() * 800;
      sy = 200 + Math.random() * (WORLD_H - 400);
    }

    const rand = Math.random();
    const type = rand < 0.2 ? 'tank' : (rand < 0.5 ? 'sprinter' : 'normal');
    zombies.push(new BrutalZombie(sx, sy, type));
  }
}

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener("resize", resize);
resize();

// Deploy Initial Squad
for (let i = 0; i < 4; i++) spawnOperator();
selectAllTeam();

// -------------------------------------------------------------
// MAIN RENDER LOOP
// -------------------------------------------------------------
function renderLoop() {
  maintainHorde();

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Terrain
  ctx.fillStyle = "#634730";
  ctx.fillRect(townZone.x, townZone.y, townZone.w, townZone.h);

  ctx.fillStyle = "#121a14";
  ctx.fillRect(forestZone.x, forestZone.y, forestZone.w, forestZone.h);

  // Roads
  ctx.strokeStyle = "rgba(45, 30, 15, 0.4)";
  ctx.lineWidth = 50;
  ctx.beginPath();
  ctx.moveTo(200, 350);
  ctx.lineTo(1200, 750);
  ctx.lineTo(2400, 1300);
  ctx.lineTo(3300, 1350);
  ctx.stroke();

  // Bases
  bases.forEach(b => {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(b.x + 14, b.y + 14, b.w, b.h);
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = b.p === 1 ? "#1e3a8a" : "#0284c7";
    ctx.fillRect(b.x + 8, b.y + 8, b.w - 16, 18);

    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText(b.name, b.x + 16, b.y + 50);
  });

  // Hive Hill
  ctx.fillStyle = "#020617";
  ctx.fillRect(hiveHill.x, hiveHill.y, hiveHill.w, hiveHill.h);
  ctx.fillStyle = "#ef4444";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("☠️ THE ABYSSAL HIVE", hiveHill.x + 20, hiveHill.y + 40);

  // Blood Splatters
  bloodSplats.forEach(b => b.draw());

  // Trees
  scenery.forEach(t => {
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.beginPath();
    ctx.ellipse(t.x + 18, t.y + 18, t.size * 1.1, t.size * 0.7, 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#091a0c";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#133517";
    ctx.beginPath();
    ctx.arc(t.x - 3, t.y - 3, t.size * 0.75, 0, Math.PI * 2);
    ctx.fill();
  });

  // Units
  for (let i = units.length - 1; i >= 0; i--) {
    units[i].update();
    units[i].draw();
    if (units[i].hp <= 0) units.splice(i, 1);
  }

  // Zombies
  for (let i = zombies.length - 1; i >= 0; i--) {
    zombies[i].update();
    zombies[i].draw();
    if (zombies[i].hp <= 0) zombies.splice(i, 1);
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.tx, b.ty);
    ctx.stroke();

    b.life--;
    if (b.life === 1) {
      zombies.forEach(z => {
        if (Math.hypot(z.x - b.tx, z.y - b.ty) < 26) {
          z.hp -= b.dmg;
          bloodSplats.push(new BloodSplat(z.x, z.y));
        }
      });
    }
    if (b.life <= 0) bullets.splice(i, 1);
  }

  ctx.restore();
  requestAnimationFrame(renderLoop);
}

renderLoop();
</script>

</body>
</html>

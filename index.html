
















<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura Coach — Focus & Physics Journal</title>
  <!-- App Mode Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAF9F6">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Pyidaungsu:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Claude AI Signature Warm Editorial Palette */
      --bg-base: #FAF9F6;
      --surface: #FFFFFF;
      --surface-subtle: #F4F1EA;
      --border: #E5E1D8;
      --border-focus: #D0C9B8;
      --text-main: #232220;
      --text-muted: #66635C;
      --text-light: #9B988E;
      --terracotta: #C96442;
      --terracotta-soft: rgba(201, 100, 66, 0.1);
      --font-serif: "Newsreader", "Pyidaungsu", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", "Pyidaungsu", -apple-system, sans-serif;
      --shadow: 0 4px 20px rgba(35, 34, 32, 0.04), 0 1px 3px rgba(35, 34, 32, 0.02);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 80px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top App Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-dot {
      width: 14px;
      height: 14px;
      background: var(--terracotta);
      border-radius: 50%;
    }
    .brand-name {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .date-control {
      display: flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
    }
    .date-control input {
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Coach Status & Chain-Alarm Indicator */
    .coach-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .coach-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--terracotta);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .coach-quote {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      color: var(--text-main);
      line-height: 1.45;
    }
    .chain-alarm-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-subtle);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .btn-test {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-main);
    }

    /* Schedule Feed */
    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .routine-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .routine-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }
    .routine-box.active-step {
      border-color: var(--terracotta);
      background: #FFFDFC;
      box-shadow: 0 4px 16px rgba(201, 100, 66, 0.12);
    }
    .routine-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .routine-title {
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text-main);
      width: 60%;
    }
    .routine-title:focus { border-bottom: 1px dashed var(--terracotta); }
    .time-slot {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .time-slot input {
      border: none;
      background: transparent;
      font-size: 0.78rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }
    .routine-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
    }
    .routine-desc:focus { color: var(--text-main); border-bottom: 1px solid var(--border-focus); }
    .btn-del {
      border: none;
      background: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 6px;
    }
    .btn-del:hover { color: #dc2626; }

    .btn-add-block {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-add-block:hover { border-color: var(--terracotta); color: var(--terracotta); background: #fff; }

    /* Enlarged Dual NotePad (Typing + Stylus Canvas) */
    .notepad-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .notepad-tabs {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
    }
    .tab-pills {
      display: flex;
      gap: 6px;
    }
    .tab-pill {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-pill.active {
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: #fff;
    }
    .canvas-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .canvas-actions input[type="color"] {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    /* Type Editor Area */
    #textPadArea {
      width: 100%;
      min-height: 480px;
      padding: 24px;
      border: none;
      outline: none;
      font-family: var(--font-serif);
      font-size: 1.15rem;
      line-height: 1.8;
      color: var(--text-main);
      background-color: var(--surface);
      background-image: linear-gradient(#F0EDE6 1px, transparent 1px);
      background-size: 100% 36px;
      resize: vertical;
    }

    /* Canvas Drawing Area */
    #canvasContainer {
      width: 100%;
      height: 480px;
      position: relative;
      display: none;
      background-color: #FAF8F4;
      background-image: 
        linear-gradient(to right, #EFECE3 1px, transparent 1px),
        linear-gradient(to bottom, #EFECE3 1px, transparent 1px);
      background-size: 28px 28px;
    }
    #drawCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* Chain Alarm Banner (Popup) */
    .alert-banner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 2px solid var(--terracotta);
      border-radius: 30px;
      padding: 12px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 10000;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Top App Navigation -->
  <header class="top-bar">
    <div class="brand-mark">
      <div class="brand-dot"></div>
      <div class="brand-name">Rhythm & Focus</div>
    </div>
    <div class="date-control">
      <input type="date" id="appDate">
    </div>
  </header>

  <!-- Dynamic Coach & Alarm Status -->
  <section class="coach-card">
    <div class="coach-header">
      <span>AI Coach Assistant</span>
      <span id="liveClock">00:00:00</span>
    </div>
    <div class="coach-quote" id="coachPhrase">
      “Physics ဆိုတာ သင်္ချာသင်္ကေတတွေထက် သဘာဝတရား ဘယ်လို အလုပ်လုပ်သလဲဆိုတာကို နားလည်အောင် တွေးဆခြင်း ဖြစ်တယ်။”
    </div>
    <div class="chain-alarm-bar">
      <span id="activeSlotStatus">🔔 Chain Alarm Active: တစ်ခုပြီးတိုင်း အသံမြည်ပေးပါမည်</span>
      <button class="btn-test" onclick="testAudio()">အသံစမ်းရန်</button>
    </div>
  </section>

  <!-- Flexible Schedule Blocks -->
  <div class="schedule-header">
    <span>TODAY'S OPERATIONAL BLOCKS</span>
  </div>
  <div class="routine-container" id="scheduleList"></div>
  <button class="btn-add-block" onclick="addCustomTask()">+ Add Next Routine Topic</button>

  <!-- Spacious Dual NotePad (Typing + Pen Canvas) -->
  <section class="notepad-panel">
    <div class="notepad-tabs">
      <div class="tab-pills">
        <button class="tab-pill active" id="tabType" onclick="switchMode('type')">✍️ Type Notes</button>
        <button class="tab-pill" id="tabDraw" onclick="switchMode('draw')">✒️ Stylus Canvas</button>
      </div>
      <div class="canvas-actions" id="canvasTools" style="display: none;">
        <input type="color" id="inkColor" value="#232220">
        <button class="btn-test" onclick="setInk(2)">Fine (2px)</button>
        <button class="btn-test" onclick="setInk(4)">Pen (4px)</button>
        <button class="btn-test" onclick="clearCanvasDraw()">Clear</button>
      </div>
    </div>

    <!-- Text Typing System -->
    <textarea id="textPadArea" placeholder="ဒီနေရာမှာ စာရိုက်၍ သင်ခန်းစာ အကျဉ်းချုပ်များနှင့် Feynman Reflection များကို ရေးသားနိုင်ပါသည်..."></textarea>

    <!-- Stylus Drawing System -->
    <div id="canvasContainer">
      <canvas id="drawCanvas"></canvas>
    </div>
  </section>
</div>

<!-- Chain Alarm Popup Modal -->
<div class="alert-banner" id="chainAlert">
  <span style="font-size: 1.4rem;">🔔</span>
  <div>
    <div style="font-weight: 700; font-size: 0.95rem; color: var(--terracotta);" id="alertHead">Time Completed!</div>
    <div style="font-size: 0.85rem; color: var(--text-main);" id="alertNext">Next step is now active.</div>
  </div>
</div>

<script>
  // Initial Routine Schema
  const defaultRoutine = [
    { title: "🌅 Morning Kickstart", start: "06:00", end: "07:00", desc: "နိုးထ၊ မျက်နှာသစ်၊ ရေချိုး၊ မနက်စာပြင်ဆင်စားသောက်ခြင်း" },
    { title: "📚 Core Deep Study (Physics)", start: "07:00", end: "09:30", desc: "နားမလည်သော Theory နှင့် Concept များကို YouTube Visuals ဖြင့် ကြည့်ရှုလေ့လာခြင်း" },
    { title: "🏫 Campus Lectures / Midday", start: "09:30", end: "13:00", desc: "ကျောင်းတက်ခြင်း / နေ့လယ်စာ / ခေတ္တအနားယူခြင်း" },
    { title: "✍️ Problem Solving & Derivations", start: "13:00", end: "15:30", desc: "ပုစ္ဆာများတွက်ခြင်း၊ Stylus Canvas ပေါ်တွင် လက်ရေးဖြင့် တွက်ချက်ခြင်း" },
    { title: "⚡ Rest & Personal Growth", start: "15:30", end: "18:30", desc: "အင်္ဂလိပ်စာ၊ စာအုပ်ဖတ်ခြင်း၊ လမ်းလျှောက်ခြင်း" },
    { title: "🍲 Dinner & Family Time", start: "18:30", end: "20:00", desc: "ညစာစားခြင်း၊ စိတ်လက်အပန်းဖြေခြင်း" },
    { title: "🔄 Feynman Synthesis Review", start: "20:00", end: "22:30", desc: "ဒီနေ့သင်ယူခဲ့သည်များကို အသံထွက်ပြီး ပြန်လည်ရှင်းပြခြင်း" },
    { title: "😴 Restorative Sleep (7 Hours)", start: "23:00", end: "06:00", desc: "ဖုန်းပိတ်၊ အိပ်ရာဝင်ပြီး ဦးနှောက်ကို အပြည့်အဝ အားပြန်ဖြည့်ခြင်း" }
  ];

  let routines = JSON.parse(localStorage.getItem('rhythm_routines')) || defaultRoutine;

  // Sound Engine (Web Audio Synth - Double Chime)
  let audioCtx = null;
  function playHarmonicChime() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;

    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc1.frequency.setValueAtTime(659.25, now); // E5
    osc2.frequency.setValueAtTime(880, now + 0.15); // A5

    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

    osc1.connect(gainNode);
    osc2.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start(now);
    osc1.stop(now + 0.2);
    osc2.start(now + 0.15);
    osc2.stop(now + 1.4);
  }

  function triggerChainAlarm(completedTask, nextTask) {
    playHarmonicChime();
    const banner = document.getElementById('chainAlert');
    document.getElementById('alertHead').innerText = `အချိန်ပြည့်ပါပြီ: ${completedTask}`;
    document.getElementById('alertNext').innerText = `နောက်တစ်ခုစတင်ပါပြီ: ${nextTask}`;
    banner.style.display = 'flex';
    setTimeout(() => { banner.style.display = 'none'; }, 8000);
  }

  function testAudio() {
    playHarmonicChime();
    triggerChainAlarm("စမ်းသပ်မှု ပြီးဆုံး", "စာလေ့လာရန် အသင့်ဖြစ်ပါပြီ");
  }

  // Render & Persistence
  function renderSchedule() {
    const list = document.getElementById('scheduleList');
    list.innerHTML = '';
    routines.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'routine-box';
      card.id = `step-${index}`;
      card.innerHTML = `
        <div class="routine-top">
          <input class="routine-title" value="${item.title}" onchange="editTask(${index}, 'title', this.value)">
          <div style="display:flex; align-items:center;">
            <div class="time-slot">
              <input type="time" value="${item.start}" onchange="editTask(${index}, 'start', this.value)">
              <span>→</span>
              <input type="time" value="${item.end}" onchange="editTask(${index}, 'end', this.value)">
            </div>
            <button class="btn-del" onclick="deleteTask(${index})">✕</button>
          </div>
        </div>
        <input class="routine-desc" value="${item.desc}" onchange="editTask(${index}, 'desc', this.value)">
      `;
      list.appendChild(card);
    });
  }

  function editTask(index, field, value) {
    routines[index][field] = value;
    localStorage.setItem('rhythm_routines', JSON.stringify(routines));
  }

  function addCustomTask() {
    routines.push({ title: "Task Block အသစ်", start: "12:00", end: "13:00", desc: "ဒီအပိုင်းမှာ လုပ်ဆောင်မည့် အကြောင်းအရာ" });
    localStorage.setItem('rhythm_routines', JSON.stringify(routines));
    renderSchedule();
  }

  function deleteTask(index) {
    routines.splice(index, 1);
    localStorage.setItem('rhythm_routines', JSON.stringify(routines));
    renderSchedule();
  }

  // Live Tracking & Chain Alarm Clock
  let notifiedTransition = new Set();

  function tickSystem() {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
    const currentHM = now.toTimeString().slice(0, 5);

    let activeFound = false;

    routines.forEach((task, idx) => {
      const el = document.getElementById(`step-${idx}`);
      if (!el) return;

      if (currentHM >= task.start && currentHM < task.end) {
        el.classList.add('active-step');
        document.getElementById('activeSlotStatus').innerText = `⚡ လက်ရှိ လုပ်ဆောင်နေသည်: ${task.title}`;
        activeFound = true;
      } else {
        el.classList.remove('active-step');
      }

      // Chain Alarm: Task transition trigger
      if (task.end === currentHM && !notifiedTransition.has(task.end)) {
        const next = routines[idx + 1] ? routines[idx + 1].title : "Rest of Day Flow";
        triggerChainAlarm(task.title, next);
        notifiedTransition.add(task.end);
      }
    });

    if (!activeFound) {
      document.getElementById('activeSlotStatus').innerText = "🔔 Chain Alarm Active: အချိန်ဇယားအတိုင်း အသံမြည်ပါမည်";
    }

    if (now.getSeconds() === 0 && now.getMinutes() === 0) notifiedTransition.clear();
  }

  // Dual NotePad Logic (Typing + Canvas)
  const textPad = document.getElementById('textPadArea');
  const canvasBox = document.getElementById('canvasContainer');
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let isPainting = false;
  let strokeWidth = 2;
  let strokeColor = '#232220';

  function switchMode(mode) {
    if (mode === 'type') {
      textPad.style.display = 'block';
      canvasBox.style.display = 'none';
      document.getElementById('canvasTools').style.display = 'none';
      document.getElementById('tabType').classList.add('active');
      document.getElementById('tabDraw').classList.remove('active');
    } else {
      textPad.style.display = 'none';
      canvasBox.style.display = 'block';
      document.getElementById('canvasTools').style.display = 'flex';
      document.getElementById('tabDraw').classList.add('active');
      document.getElementById('tabType').classList.remove('active');
      resizeCanvas();
    }
  }

  // Auto-Save Text Notes by Date
  textPad.addEventListener('input', () => {
    const key = 'text_note_' + document.getElementById('appDate').value;
    localStorage.setItem(key, textPad.value);
  });

  function loadDateNotes() {
    const date = document.getElementById('appDate').value;
    textPad.value = localStorage.getItem('text_note_' + date) || '';
    loadCanvasDraw();
  }

  // Canvas Hand-drawing Logic
  function resizeCanvas() {
    canvas.width = canvasBox.clientWidth;
    canvas.height = canvasBox.clientHeight;
    loadCanvasDraw();
  }

  function getPointerPos(e) {
    const r = canvas.getBoundingClientRect();
    if (e.touches && e.touches[0]) {
      return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
    }
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function penDown(e) {
    isPainting = true;
    const p = getPointerPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function penMove(e) {
    if (!isPainting) return;
    const p = getPointerPos(e);
    ctx.lineWidth = strokeWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = strokeColor;
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  function penUp() {
    if (!isPainting) return;
    isPainting = false;
    ctx.closePath();
    saveCanvasDraw();
  }

  canvas.addEventListener('mousedown', penDown);
  canvas.addEventListener('mousemove', penMove);
  canvas.addEventListener('mouseup', penUp);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); penDown(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); penMove(e); }, { passive: false });
  canvas.addEventListener('touchend', penUp);

  document.getElementById('inkColor').addEventListener('input', (e) => strokeColor = e.target.value);
  function setInk(w) { strokeWidth = w; }

  function saveCanvasDraw() {
    const key = 'canvas_draw_' + document.getElementById('appDate').value;
    localStorage.setItem(key, canvas.toDataURL());
  }

  function loadCanvasDraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const key = 'canvas_draw_' + document.getElementById('appDate').value;
    const data = localStorage.getItem(key);
    if (data) {
      const img = new Image();
      img.src = data;
      img.onload = () => ctx.drawImage(img, 0, 0);
    }
  }

  function clearCanvasDraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const key = 'canvas_draw_' + document.getElementById('appDate').value;
    localStorage.removeItem(key);
  }

  // App Initialization
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('appDate').value = new Date().toISOString().split('T')[0];
    renderSchedule();
    loadDateNotes();
    tickSystem();
    setInterval(tickSystem, 1000);
  });

  document.getElementById('appDate').addEventListener('change', loadDateNotes);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine & Focus — Claude Aesthetic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Newsreader (Claude's signature editorial serif) & Plus Jakarta Sans / Pyidaungsu -->
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=Pyidaungsu:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Claude signature warm aesthetic palette */
      --bg-cream: #FAF9F5;
      --card-bg: #FFFFFF;
      --card-border: #E8E5DE;
      --card-hover: #F3EFE6;
      --text-main: #242423;
      --text-muted: #6B6861;
      --text-light: #9B9890;
      --terracotta: #D97757;
      --terracotta-soft: rgba(217, 119, 87, 0.12);
      --font-serif: "Newsreader", "Pyidaungsu", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", "Pyidaungsu", -apple-system, sans-serif;
      --shadow-sm: 0 1px 3px rgba(40, 35, 25, 0.04), 0 4px 12px rgba(40, 35, 25, 0.03);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px 80px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Claude-style minimalist header */
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-titles h1 {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.15;
    }

    .header-titles p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.01em;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }

    .date-badge input[type="date"] {
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Daily Goal Input */
    .goal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s;
    }

    .goal-card:focus-within {
      border-color: var(--terracotta);
    }

    .goal-card svg {
      flex-shrink: 0;
      color: var(--terracotta);
    }

    .goal-card input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      color: var(--text-main);
      outline: none;
    }

    .goal-card input::placeholder {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--text-light);
    }

    /* Schedule Blocks */
    .routine-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .block-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 14px;
      align-items: flex-start;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .block-card:hover {
      border-color: #D6D2C4;
      background: #FDFAF5;
    }

    .icon-container {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border: 1px solid #ECE7DC;
    }

    .block-card.highlight .icon-container {
      background: var(--terracotta-soft);
      color: var(--terracotta);
      border-color: rgba(217, 119, 87, 0.2);
    }

    .block-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .block-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .time-selector {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-cream);
      border: 1px solid var(--card-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .time-selector input[type="time"] {
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .block-details input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      outline: none;
      border-bottom: 1px solid transparent;
      padding: 3px 0;
      transition: all 0.2s ease;
    }

    .block-details input:focus {
      color: var(--text-main);
      border-bottom: 1px dashed var(--terracotta);
    }

    /* Subtle footer quote */
    .aesthetic-footer {
      text-align: center;
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--text-light);
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Header Section -->
  <header class="header-panel">
    <div class="header-titles">
      <h1>Daily Rhythm</h1>
      <p>Physics Second Year · Self-Study Mastery</p>
    </div>
    <div class="date-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <input type="date" id="dailyDate">
    </div>
  </header>

  <!-- Daily Focus Section -->
  <div class="goal-card">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    <input type="text" id="dailyGoal" placeholder="Today's Core Physics Concept (ဥပမာ- Wave Optics သဘောတရား)...">
  </div>

  <!-- Routine Cards -->
  <main class="routine-feed">

    <!-- 1. Morning Routine -->
    <div class="block-card">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.95 9.05A6 6 0 1 0 8.05 16.95"/><path d="M2 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="M16 22H8"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Morning Routine</span>
          <div class="time-selector">
            <input type="time" value="06:00"> <span>–</span> <input type="time" value="07:00">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="အိပ်ရာထ၊ သွားတိုက်၊ ရေချိုး၊ မနက်စာပြင်ဆင်ပြီး စားသောက်ခြင်း">
        </div>
      </div>
    </div>

    <!-- 2. Deep Study (Highlight) -->
    <div class="block-card highlight">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Core Deep Study</span>
          <div class="time-selector">
            <input type="time" value="07:00"> <span>–</span> <input type="time" value="09:30">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="Physics Concepts လေ့လာခြင်း (Khan Academy / YouTube Visual Lectures)">
        </div>
      </div>
    </div>

    <!-- 3. Campus / Lunch -->
    <div class="block-card">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Campus & Midday</span>
          <div class="time-selector">
            <input type="time" value="09:30"> <span>–</span> <input type="time" value="13:00">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="ကျောင်းချိန် / နေ့လယ်စာ / ခေတ္တအနားယူချိန်">
        </div>
      </div>
    </div>

    <!-- 4. Problem Solving (Highlight) -->
    <div class="block-card highlight">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Problem Solving & Practice</span>
          <div class="time-selector">
            <input type="time" value="13:00"> <span>–</span> <input type="time" value="15:30">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="Physics လေ့ကျင့်ခန်း ပုစ္ဆာများတွက်ချက်ခြင်း၊ ကိုယ်ပိုင်သင်္ကေတဖြင့် မှတ်စုထုတ်ခြင်း">
        </div>
      </div>
    </div>

    <!-- 5. Growth & Rest -->
    <div class="block-card">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Growth & Recharge</span>
          <div class="time-selector">
            <input type="time" value="15:30"> <span>–</span> <input type="time" value="18:30">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="အင်္ဂလိပ်စာ၊ စာဖတ်ခြင်း၊ လမ်းလျှောက် အကြောလျှော့ခြင်း">
        </div>
      </div>
    </div>

    <!-- 6. Dinner & Family -->
    <div class="block-card">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" x2="6" y1="1" y2="4"/><line x1="10" x2="10" y1="1" y2="4"/><line x1="14" x2="14" y1="1" y2="4"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Dinner & Refresh</span>
          <div class="time-selector">
            <input type="time" value="18:30"> <span>–</span> <input type="time" value="20:00">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="ညစာစားခြင်း၊ အနားယူခြင်း၊ စိတ်ဖိစီးမှုလျှော့ချခြင်း">
        </div>
      </div>
    </div>

    <!-- 7. Review -->
    <div class="block-card">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Review & Feynman Recall</span>
          <div class="time-selector">
            <input type="time" value="20:00"> <span>–</span> <input type="time" value="22:30">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="ဒီနေ့သင်ခဲ့တာတွေကို ကိုယ့်ဘာသာ အသံထွက်ပြီး ပြန်ရှင်းပြကြည့်ခြင်း">
        </div>
      </div>
    </div>

    <!-- 8. Sleep -->
    <div class="block-card">
      <div class="icon-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </div>
      <div class="block-content">
        <div class="block-header">
          <span class="block-title">Deep Sleep (7 Hours)</span>
          <div class="time-selector">
            <input type="time" value="23:00"> <span>–</span> <input type="time" value="06:00">
          </div>
        </div>
        <div class="block-details">
          <input type="text" value="ဖုန်းပိတ်၊ မီးမှိန်ပြီး နောက်တစ်နေ့အတွက် အပြည့်အဝ အားပြန်ဖြည့်ခြင်း">
        </div>
      </div>
    </div>

  </main>

  <footer class="aesthetic-footer">
    “Understanding is deeper than knowledge. Learn to see the pattern.”
  </footer>
</div>

<script>
  // Set current date automatically
  const dateInput = document.getElementById('dailyDate');
  dateInput.value = new Date().toISOString().split('T')[0];

  // Auto-save any edit to localStorage
  const inputs = document.querySelectorAll('input');
  inputs.forEach((input, index) => {
    const key = 'claude_routine_' + index;
    const saved = localStorage.getItem(key);
    if (saved) input.value = saved;

    input.addEventListener('input', () => {
      localStorage.setItem(key, input.value);
    });
  });
</script>

</body>
</html>

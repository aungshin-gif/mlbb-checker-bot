<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nightmare Outpost: 10x Horde & Zoom RTS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #010204;

<body>

<div id="top-hud">
  <div class="hud-left">
    <span id="player-indicator" style="color: #38bdf8;">SQUAD 1 (BLUE)</span>
    <span style="color:#475569;">|</span>
    <span id="threat-level" style="color: #ef4444;">HORDE ACTIVE</span>

  </div>
  <div class="btn-bar">
    <button class="hud-btn horde-alert" onclick="triggerImmediateSwarm()">🚨 CALL 15x HORDE</button>

    <button class="hud-btn" onclick="spawnOperator()">+ RECRUIT</button>

<div id="horde-banner">⚠️ INCOMING 15x SWARM DETECTED! DEFEND POSITION!</div>

<div id="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="zoom-hud">
    <button class="zoom-btn" onclick="setZoomLevel(0.4)">🌍</button>
    <button class="zoom-btn" onclick="adjustZoom(-0.25)">−</button>
    <button class="zoom-btn" onclick="adjustZoom(0.25)">+</button>
  </div>
  <div id="mobile-hint">
    👉 လက် ၂ ချောင်းဖြင့် Pinch ဆွဲ၍ ကျုံ့/ချဲ့ပါ | Drag ဖြင့် မြေပုံရွှေ့ပါ | Tap ဖြင့် တပ်ရွှေ့ပါ
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Sound Synthesizer
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playGunfire() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(340, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.08);
}
function playScream() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.linearRampToValueAtTime(40, now + 0.3);
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.3);
}

// Map Dimensions
const WORLD_W = 4200;
const WORLD_H = 2800;
let camera = { x: 200, y: 300 };
let zoomScale = 1.0; // Dynamic Zoom Scale (0.35 to 1.8)

let currentPlayer = 1;
let units = [];
let zombies = [];
let bullets = [];
let bloodSplats = [];
let scenery = [];
let casualties = 0;

// Zones
const townZone = { x: 0, y: 0, w: 1700, h: WORLD_H };
const forestZone = { x: 1700, y: 0, w: 2500, h: WORLD_H };
const hiveHill = { x: 3400, y: 1100, w: 700, h: 800 };

const bases = [
  { x: 160, y: 350, w: 220, h: 160, name: "Alpha Garrison (P1)", p: 1 },
  { x: 160, y: 2000, w: 220, h: 160, name: "Bravo Garrison (P2)", p: 2 }
];

for (let i = 0; i < 360; i++) {
  scenery.push({
    x: forestZone.x + 80 + Math.random() * (forestZone.w - 160),
    y: 80 + Math.random() * (WORLD_H - 160),
    size: 38 + Math.random() * 26
  });
}

// -------------------------------------------------------------
// SQUAD OPERATOR
// -------------------------------------------------------------
class TacticalOperator {
  constructor(x, y, player) {
    this.x = x;
    this.y = y;
    this.player = player;
    this.targetX = x;
    this.targetY = y;
    this.selected = false;
    this.hp = 100;
    this.maxHp = 100;
    this.speed = 2.8;
    this.facing = 0;
    this.walkAnim = 0;
    this.isMoving = false;
    this.shootCooldown = 0;
    this.muzzleTime = 0;
    this.range = 230;
  }

  update() {
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 8) {
      this.isMoving = true;
      this.facing = Math.atan2(dy, dx);
      this.x += (dx / dist) * this.speed;
      this.y += (dy / dist) * this.speed;
      this.walkAnim += 0.35;
    } else {
      this.isMoving = false;
    }

    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.shootCooldown === 0) {
      let target = null;
      let minD = this.range;

      zombies.forEach(z => {
        const d = Math.hypot(z.x - this.x, z.y - this.y);
        if (d < minD) {
          minD = d;
          target = z;
        }
      });

      if (target) {
        this.facing = Math.atan2(target.y - this.y, target.x - this.x);
        this.muzzleTime = 2;
        this.shootCooldown = 13;
        playGunfire();

        bullets.push({
          x: this.x + Math.cos(this.facing) * 24,
          y: this.y + Math.sin(this.facing) * 24,
          tx: target.x, ty: target.y,
          dmg: 18, life: 6
        });
      }
    }
  }

  draw() {
    const inForest = this.x > forestZone.x;
    if (inForest) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.facing);
      const grad = ctx.createRadialGradient(0, 0, 10, 160, 0, 230);
      grad.addColorStop(0, "rgba(255, 250, 210, 0.65)");
      grad.addColorStop(0.5, "rgba(255, 240, 180, 0.2)");
      grad.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 230, -Math.PI / 4.5, Math.PI / 4.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.beginPath();
    ctx.ellipse(this.x + 4, this.y + 6, 12, 6, this.facing, 0, Math.PI * 2);
    ctx.fill();

    if (this.selected) {
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 24, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing);

    const legSwing = this.isMoving ? Math.sin(this.walkAnim) * 7 : 0;
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(-12 + legSwing, -8, 7, 4);
    ctx.fillRect(-12 - legSwing, 4, 7, 4);

    ctx.fillStyle = this.player === 1 ? "#1e3a8a" : "#0284c7";
    ctx.fillRect(-10, -9, 17, 18);

    ctx.fillStyle = "#020617";
    ctx.fillRect(-13, -7, 4, 14);

    const bodySway = this.isMoving ? Math.sin(this.walkAnim * 0.5) * 1.5 : 0;
    ctx.fillStyle = "#1e40af";
    ctx.beginPath();
    ctx.arc(-2, -9 + bodySway, 4, 0, Math.PI * 2);
    ctx.arc(-2, 9 + bodySway, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, -7, 12, 4);
    ctx.fillRect(3, 4, 9, 3.5);

    ctx.fillStyle = "#111827";
    ctx.fillRect(5, 1, 20, 3.5);
    ctx.fillStyle = "#374151";
    ctx.fillRect(9, 0, 7, 5);

    ctx.fillStyle = "#020617";
    ctx.beginPath();
    ctx.arc(-1, 0, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(2, -3.5, 3.5, 7);

    if (this.muzzleTime > 0) {
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(28, 3, 9, 0, Math.PI * 2);
      ctx.fill();
      this.muzzleTime--;
    }
    ctx.restore();

    // Health Bar
    if (this.hp < this.maxHp) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(this.x - 12, this.y - 24, 24, 4);
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(this.x - 12, this.y - 24, 24 * (this.hp / this.maxHp), 4);
    }
  }
}

// -------------------------------------------------------------
// DEADLY HORDE ZOMBIE CLASS (Goliaths, Sprinters, Swarmers)
// -------------------------------------------------------------
class NightmareZombie {
  constructor(x, y, type = 'normal') {
    this.x = x;
    this.y = y;
    this.type = type; // 'normal', 'sprinter', 'goliath'
    this.hp = type === 'goliath' ? 750 : (type === 'sprinter' ? 120 : 180);
    this.maxHp = this.hp;
    this.speed = type === 'goliath' ? 1.1 : (type === 'sprinter' ? 3.3 : 1.9);
    this.damage = type === 'goliath' ? 36 : (type === 'sprinter' ? 16 : 22);
    this.facing = 0;
    this.biteTimer = 0;
    this.limpCycle = Math.random() * 10;
  }

  update() {
    let closest = null;
    let minD = 500;

    units.forEach(u => {
      const d = Math.hypot(u.x - this.x, u.y - this.y);
      if (d < minD) {
        minD = d;
        closest = u;
      }
    });

    if (closest) {
      const dx = closest.x - this.x;
      const dy = closest.y - this.y;
      const dist = Math.hypot(dx, dy);

      this.facing = Math.atan2(dy, dx);
      this.limpCycle += 0.3;

      if (dist > 14) {
        const lurch = Math.sin(this.limpCycle) * 0.45;
        this.x += (dx / dist) * (this.speed + lurch);
        this.y += (dy / dist) * (this.speed + lurch);
      } else {
        if (this.biteTimer === 0) {
          closest.hp -= this.damage;
          this.biteTimer = 18;
          playScream();
          bloodSplats.push(new BloodSplat(closest.x, closest.y));

          // Death & Immediate Infection Spawn
          if (closest.hp <= 0) {
            casualties++;
            document.getElementById("casualty-count").innerText = `Dead: ${casualties}`;
            setTimeout(() => {
              zombies.push(new NightmareZombie(closest.x, closest.y, 'sprinter'));
            }, 500);
          }
        }
      }
    }
    if (this.biteTimer > 0) this.biteTimer--;
  }

  draw() {
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.beginPath();
    ctx.ellipse(this.x + 3, this.y + 5, this.type === 'goliath' ? 20 : 10, 6, this.facing, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(this.x, this.y);
    ctx.rotate(this.facing);

    const scale = this.type === 'goliath' ? 1.8 : (this.type === 'sprinter' ? 0.95 : 1.1);
    ctx.scale(scale, scale);

    ctx.fillStyle = this.type === 'goliath' ? "#1c1917" : (this.type === 'sprinter' ? "#581c87" : "#334155");
    ctx.fillRect(-8, -8, 14, 16);

    const armWiggle = Math.sin(this.limpCycle) * 5;
    ctx.fillStyle = "#475569";
    ctx.fillRect(4, -8 + armWiggle, 14, 3.5);
    ctx.fillRect(4, 5 - armWiggle, 14, 3.5);

    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(3, -3, 2.5, 2.5);
    ctx.fillRect(3, 1, 2.5, 2.5);

    ctx.restore();

    // Goliath Boss Health Bar
    if (this.type === 'goliath') {
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(this.x - 22, this.y - 32, 44, 5);
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(this.x - 22, this.y - 32, 44 * (this.hp / this.maxHp), 5);
    }
  }
}

class BloodSplat {
  constructor(x, y) {
    this.x = x + (Math.random() * 18 - 9);
    this.y = y + (Math.random() * 18 - 9);
    this.size = 8 + Math.random() * 14;
  }
  draw() {
    ctx.fillStyle = "rgba(185, 28, 28, 0.75)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// -------------------------------------------------------------
// 10-15x SWARM PACK GENERATOR (အကောင် ၁၀-၁၅ ကောင် တပြိုင်နက် ပြေးထွက်လာခြင်း)
// -------------------------------------------------------------
function spawnSwarmCluster(count = 12) {
  const originX = hiveHill.x + Math.random() * hiveHill.w;
  const originY = hiveHill.y + Math.random() * hiveHill.h;

  const banner = document.getElementById("horde-banner");
  banner.style.display = "block";
  setTimeout(() => banner.style.display = "none", 4000);

  for (let i = 0; i < count; i++) {
    const sx = originX + (Math.random() * 140 - 70);
    const sy = originY + (Math.random() * 140 - 70);
    const type = i === 0 ? 'goliath' : (Math.random() < 0.4 ? 'sprinter' : 'normal');
    zombies.push(new NightmareZombie(sx, sy, type));
  }
}

function triggerImmediateSwarm() {
  initAudio();
  playScream();
  spawnSwarmCluster(15);
}

// Periodic Automatic 12x Swarm Waves
setInterval(() => {
  if (units.length > 0) {
    spawnSwarmCluster(12);
  }
}, 22000);

// -------------------------------------------------------------
// PINCH-TO-ZOOM & MULTI-TOUCH ENGINE (Screen ကျုံ့ချဲ့ခြင်းနှင့် Drag)
// -------------------------------------------------------------
let isTouching = false;
let touchStartDist = 0;
let initialScale = 1.0;
let lastPointer = { x: 0, y: 0 };
let touchStartTime = 0;

function getTouchDistance(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  initAudio();
  touchStartTime = Date.now();

  if (e.touches.length === 2) {
    // Two-finger Pinch Zoom
    touchStartDist = getTouchDistance(e.touches);
    initialScale = zoomScale;
  } else if (e.touches.length === 1) {
    // Single finger Map Drag
    isTouching = true;
    lastPointer.x = e.touches[0].clientX;
    lastPointer.y = e.touches[0].clientY;
  }
}, { passive: false });

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const currentDist = getTouchDistance(e.touches);
    if (touchStartDist > 0) {
      const scaleChange = currentDist / touchStartDist;
      zoomScale = Math.max(0.35, Math.min(1.8, initialScale * scaleChange));
    }
  } else if (e.touches.length === 1 && isTouching) {
    const dx = e.touches[0].clientX - lastPointer.x;
    const dy = e.touches[0].clientY - lastPointer.y;
    camera.x -= dx / zoomScale;
    camera.y -= dy / zoomScale;
    clampCamera();
    lastPointer.x = e.touches[0].clientX;
    lastPointer.y = e.touches[0].clientY;
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  if (e.touches.length < 2) touchStartDist = 0;
  if (e.touches.length === 0) {
    isTouching = false;
    const duration = Date.now() - touchStartTime;
    // Tap to move team
    if (duration < 250) {
      const touch = e.changedTouches[0];
      const rect = canvas.getBoundingClientRect();
      const screenX = touch.clientX - rect.left;
      const screenY = touch.clientY - rect.top;

      const worldX = (screenX / zoomScale) + camera.x;
      const worldY = (screenY / zoomScale) + camera.y;

      const selected = units.filter(u => u.selected && u.player === currentPlayer);
      if (selected.length > 0) {
        selected.forEach((u, i) => {
          u.targetX = worldX + (i % 4) * 32 - 48;
          u.targetY = worldY + Math.floor(i / 4) * 32 - 48;
        });
      }
    }
  }
}, { passive: false });

// Mouse Wheel Zoom (ကွန်ပျူတာအတွက်)
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 0.15 : -0.15;
  adjustZoom(zoomFactor);
}, { passive: false });

// Mouse Drag Map & Tap
let isMouseDown = false;
canvas.addEventListener("mousedown", (e) => {
  isMouseDown = true;
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
  touchStartTime = Date.now();
});
canvas.addEventListener("mousemove", (e) => {
  if (isMouseDown) {
    const dx = e.clientX - lastPointer.x;
    const dy = e.clientY - lastPointer.y;
    camera.x -= dx / zoomScale;
    camera.y -= dy / zoomScale;
    clampCamera();
    lastPointer.x = e.clientX;
    lastPointer.y = e.clientY;
  }
});
canvas.addEventListener("mouseup", (e) => {
  isMouseDown = false;
  if (Date.now() - touchStartTime < 250) {
    const rect = canvas.getBoundingClientRect();
    const worldX = ((e.clientX - rect.left) / zoomScale) + camera.x;
    const worldY = ((e.clientY - rect.top) / zoomScale) + camera.y;
    const selected = units.filter(u => u.selected && u.player === currentPlayer);
    if (selected.length > 0) {
      selected.forEach((u, i) => {
        u.targetX = worldX + (i % 4) * 32 - 48;
        u.targetY = worldY + Math.floor(i / 4) * 32 - 48;
      });
    }
  }
});

function adjustZoom(amount) {
  zoomScale = Math.max(0.35, Math.min(1.8, zoomScale + amount));
  clampCamera();
}
function setZoomLevel(level) {
  zoomScale = level;
  clampCamera();
}
function clampCamera() {
  const visibleW = canvas.width / zoomScale;
  const visibleH = canvas.height / zoomScale;
  camera.x = Math.max(0, Math.min(camera.x, WORLD_W - visibleW));
  camera.y = Math.max(0, Math.min(camera.y, WORLD_H - visibleH));
}

// -------------------------------------------------------------
// TEAM CONTROLS
// -------------------------------------------------------------
function selectAllTeam() {
  initAudio();
  units.forEach(u => u.selected = (u.player === currentPlayer));
}

function spawnOperator() {
  initAudio();
  const base = bases[0];
  const u = new TacticalOperator(base.x + base.w + 20, base.y + 30 + Math.random() * 50, currentPlayer);
  u.targetX = u.x + 80;
  u.targetY = u.y;
  u.selected = true;
  units.push(u);
}

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  clampCamera();
}
window.addEventListener("resize", resize);
resize();

// Deploy Initial Squad & First Horde Pack
for (let i = 0; i < 5; i++) spawnOperator();
selectAllTeam();
spawnSwarmCluster(12);

// -------------------------------------------------------------
// ENGINE RENDER LOOP
// -------------------------------------------------------------
function renderLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();

  // Apply Camera Zoom & Pan Transform
  ctx.scale(zoomScale, zoomScale);
  ctx.translate(-camera.x, -camera.y);

  // Terrain
  ctx.fillStyle = "#634730";
  ctx.fillRect(townZone.x, townZone.y, townZone.w, townZone.h);

  ctx.fillStyle = "#121a14";
  ctx.fillRect(forestZone.x, forestZone.y, forestZone.w, forestZone.h);

  // Roads
  ctx.strokeStyle = "rgba(45, 30, 15, 0.4)";
  ctx.lineWidth = 55;
  ctx.beginPath();
  ctx.moveTo(200, 350);
  ctx.lineTo(1200, 750);
  ctx.lineTo(2400, 1300);
  ctx.lineTo(3400, 1350);
  ctx.stroke();

  // Bases
  bases.forEach(b => {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(b.x + 14, b.y + 14, b.w, b.h);
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = b.p === 1 ? "#1e3a8a" : "#0284c7";
    ctx.fillRect(b.x + 8, b.y + 8, b.w - 16, 18);

    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText(b.name, b.x + 16, b.y + 50);
  });

  // Hive Hill (Swarm Lair)
  ctx.fillStyle = "#020617";
  ctx.fillRect(hiveHill.x, hiveHill.y, hiveHill.w, hiveHill.h);
  ctx.fillStyle = "#ef4444";
  ctx.font = "bold 18px sans-serif";
  ctx.fillText("☠️ SWARM PACK BREEDING PIT (HORDE SPAWN)", hiveHill.x + 24, hiveHill.y + 50);

  // Blood Stains
  bloodSplats.forEach(b => b.draw());

  // Trees
  scenery.forEach(t => {
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.beginPath();
    ctx.ellipse(t.x + 18, t.y + 18, t.size * 1.1, t.size * 0.7, 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#091a0c";
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#133517";
    ctx.beginPath();
    ctx.arc(t.x - 3, t.y - 3, t.size * 0.75, 0, Math.PI * 2);
    ctx.fill();
  });

  // Units
  for (let i = units.length - 1; i >= 0; i--) {
    units[i].update();
    units[i].draw();
    if (units[i].hp <= 0) units.splice(i, 1);
  }

  // Zombies
  for (let i = zombies.length - 1; i >= 0; i--) {
    zombies[i].update();
    zombies[i].draw();
    if (zombies[i].hp <= 0) zombies.splice(i, 1);
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    ctx.strokeStyle = "#fde047";
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.tx, b.ty);
    ctx.stroke();

    b.life--;
    if (b.life === 1) {
      zombies.forEach(z => {
        if (Math.hypot(z.x - b.tx, z.y - b.ty) < (z.type === 'goliath' ? 36 : 24)) {
          z.hp -= b.dmg;
          bloodSplats.push(new BloodSplat(z.x, z.y));
        }
      });
    }
    if (b.life <= 0) bullets.splice(i, 1);
  }

  ctx.restore();
  requestAnimationFrame(renderLoop);
}

renderLoop();
</script>
